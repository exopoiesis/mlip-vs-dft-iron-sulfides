benchmark_setup:
  reference:
    method: plane-wave DFT (PBE U=0)
    code: QuantumESPRESSO
    system: Local neutral-H vacancy-defect paths in dry bulk Fe-S compounds
  test_systems:
  - id: pyr_vs2_96at
    system: pyrite HFe32S63 96-atom V_S pocket, Fe-to-Fe hydrogen transfer
    DFT_Ea_meV: 94.6
    label_corrected_2026_09_22: was 'V_S2 persulfide hop'; barrier unaffected
  - id: pyr_vfe_96at
    system: pyrite FeS2 96-atom V_Fe S-H lateral hop (Dimer result)
    DFT_Ea_meV: 268
  - id: greig_vfe_56at
    system: greigite Fe3S4 56-atom V_Fe oct, trans axis
    DFT_Ea_meV: 1860
    status: RETRACTED
    retraction: not a migration path; see tm.greig.vfe.neb.2026-06-04
  - id: greig_vfe_channel_56at
    system: greigite HFe23S32 56-atom V_Fe oct, S-H hop along a CHANNEL edge
    DFT_Ea_meV: 235.97
    replaces: greig_vfe_56at
  - id: greig_vfe_cation_56at
    system: greigite HFe23S32 56-atom V_Fe oct, S-H hop along a CATION edge
    DFT_Ea_meV: 566.83
  - id: pent_vfe
    system: Incorrect Fe71S64H structural model intended as pure-Fe pentlandite
    DFT_Ea_meV: null
    status: RETRACTED
    retraction: Incorrect Wyckoff assignments and coordination; no valid pentlandite diagnosis.
  test_observables:
  - barrier Ea (eV)
  - saddle topology / band shape
  - endpoint topology preservation
metrics:
