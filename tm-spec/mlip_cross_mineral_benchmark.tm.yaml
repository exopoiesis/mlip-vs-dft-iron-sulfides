results:
  per_backend:
    MACE-MP-0:
      pyrite_VS2_meV: null
      pyrite_VS2_note: No validated self-consistent barrier under the tested construction; endpoint-seeding
        sensitivity. Legacy values withdrawn as migration barriers.
      pyrite_VFe_meV: 256
      greigite_note: 'PRISTINE-CELL RELAXATION collapses (nearest-neighbour S-S contracting to 0.072 A),
        and the ~1e10 eV figure is a consequence of that collapsed geometry, not an independent energy
        observation. On DFT-relaxed geometries the same checkpoint evaluates greigite normally: on the
        corrected channel band it returns 221.1 meV against DFT 235.97.

        '
      pentlandite_note: 'WITHDRAWN: incorrect structural model; no demonstrated cubane failure on real
        pentlandite.'
      paper_quotable: true
      pyrite_VFe_protocol: Self-consistent NEB after own-surface endpoint relaxation; previous 182/223 meV
        were frozen-endpoint values.
    CHGNet-v0.3.0:
      pyrite_VS2_meV: null
      pyrite_VS2_note: No validated self-consistent barrier under the tested construction; endpoint-seeding
        sensitivity. Legacy values withdrawn as migration barriers.
      pyrite_VFe_meV: 387
      greigite_note: 'Did not converge for the vacancy configurations under its own relaxation. On the
        corrected channel band, evaluated on the DFT geometry, it returns 254.1 meV against DFT 235.97.

        '
      pentlandite_note: 'WITHDRAWN: incorrect structural model; no demonstrated cubane failure on real
        pentlandite.'
      paper_quotable: true
      pyrite_VFe_protocol: Self-consistent NEB after own-surface endpoint relaxation; previous 182/223 meV
        were frozen-endpoint values.
  verdict:
    qualitative: System-dependent barrier errors, endpoint-seeding sensitivity and pristine-greigite relaxation
      instability under the tested setup. Pentlandite motif-failure and intrinsic marcasite band-collapse
      interpretations are withdrawn. These tests do not identify training coverage as a sole cause.
    usable_as: Screening and quantitative estimates only within the validation scope of the chosen structure,
      path and reference.
    DFT_reference_pyrite_VS2_meV: 94.6
    DFT_reference_pyrite_VFe_meV: 268
  status: PASS
  paper_quotable: true
  notes: Current two-model self-consistent comparisons are in main Section 3.3/Table 2. Nine-checkpoint energy
    profiles in ../mlip/r22_2026-09 cover five fixed DFT paths in four minerals, not 45 independent pathways;
    checkpoints share corpora. They do not retest relaxation failures of every model. Historical well-depth/endpoint-relaxation
    inequalities do not establish a general bound. Both evaluated protocols retain their own endpoint
    reference conventions.
  historical_interpretation:
    internal_review_labels:
    - chemist@opus
    - physicist@opus
    metrics:
      abs_diff_saddle_eV:
        MACE_vs_DFT_pyrVS2: 0.095
        CHGNet_vs_DFT_pyrVS2: 0.067
      frac_correct_kind:
        note: 'CHGNet magnitude-only magmom (Jiang/Xu PNAS 2025); initialized magmoms do not change CHGNet
          energy (mackinawite control: 0.0 pp shift)'
      Ea_correlation_R2:
        note: not computable -- structural collapse on 2/4 systems precludes global R2
    per_backend:
      MACE-MP-0:
        pyrite_VS2_meV: 0
        pyrite_VS2_note: flat PES, correct endpoint topology but barrier = 0
        pyrite_VFe_meV: 182
        greigite_note: 'PRISTINE-CELL RELAXATION collapses (nearest-neighbour S-S contracting to 0.072
          A), and the ~1e10 eV figure is a consequence of that collapsed geometry, not an independent
          energy observation. On DFT-relaxed geometries the same checkpoint evaluates greigite normally:
          on the corrected channel band it returns 221.1 meV against DFT 235.97.

          '
        pentlandite_note: cubane [Fe4S4] 3+3 structural collapse
        paper_quotable: true
      CHGNet-v0.3.0:
        pyrite_VS2_meV: 27.6
        pyrite_VS2_note: wrong band topology; spurious -24 meV sub-endpoint wells; saddle 3.4x below DFT
        pyrite_VFe_meV: 223
        greigite_note: 'Did not converge for the vacancy configurations under its own relaxation. On the
          corrected channel band, evaluated on the DFT geometry, it returns 254.1 meV against DFT 235.97.

          '
        pentlandite_note: cubane collapse
        paper_quotable: true
    verdict:
      qualitative: 'THREE distinct foundation-MLIP failure modes: (1) endpoint-seeding sensitivity in
        the sulfur-vacancy pocket -- placements seeded from the sulfur anchors funnel onto a single Fe
        under both potentials, so the band is degenerate and no barrier is defined (pyrite); (2) [Fe4S4]
        cubane structural-motif collapse (pentlandite); (3) relaxation instability of the pristine inverse
        spinel (greigite) -- specific to RELAXATION, since the same models evaluate greigite normally
        on DFT-relaxed geometries. Where the reaction coordinate survives (pyrite V_Fe), the error is
        model-specific once endpoints are relaxed on each model''s own surface: MACE within ~12 meV, CHGNet
        +119 meV.

        '
      withdrawn_mode: 'A fourth mode was claimed here and in the submitted manuscript: "false-positive
        band-collapse warning (marcasite)". It is WITHDRAWN. Interior images falling below the endpoints
        was the signature of endpoints left unrelaxed on the model''s own surface, and obeys a bound statable
        in advance -- the depth of a spurious interior well cannot exceed the model''s endpoint relaxation
        energy on that system. It is not a property of the potentials. Relatedly, the earlier "underbind
        DFT 1.2-1.5x" reading was an artefact of the frozen-endpoint comparison protocol, not a property
        of the models.

        '
      usable_as: topology-screening only, not quantitative barriers
      DFT_reference_pyrite_VS2_meV: 94.6
      DFT_reference_pyrite_VFe_meV: 268
    notes: 'Benchmark establishes DFT as required for quantitative barriers in Fe-S minerals. MLIP-only
      screening viable for endpoint geometry and qualitative path topology but not for paper-grade Ea.
      Both backends tested on a local RTX 4070 node (infra-mace-neb:latest); results cross-checked. Mackinawite
      nspin control confirms CHGNet energy insensitive to initialized magmoms (0.0 meV shift).

      '
