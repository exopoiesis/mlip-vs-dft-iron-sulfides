  notes: The cation-facing path is shorter and has a higher calculated barrier than the channel edge.
    The saddle has H-S distances 1.660 A and nearest H-Fe 2.469 A versus 2.966 A on the channel edge. These
    geometric contrasts do not uniquely identify the origin of the 331 meV difference. Full-space Lanczos
    was performed on the channel path only.
  quote_scope: Calculated local path-energy maximum; harmonic transition-state interpretation is conditional
    on saddle character and vibrational approximation. Not a film transport barrier.
  historical_interpretation:
    notes: 'Saddle symmetric at d(S-H) = 1.660 A to both sulfurs. The proton passes 2.469 A from the nearest
      iron here, against 2.966 A on the channel edge, and the converged saddle bows AWAY from the cation
      relative to the geometric edge midpoint (which would lie 1.68-1.75 A from Fe). The cost of that
      bow is the 331 meV gap. Note that two of the four natural geometric descriptors point the wrong
      way: this path has the SHORTER edge and compresses S...S 3.7x LESS at the saddle (0.050 vs 0.186
      A), yet is 2.40x more expensive. Only the saddle-to-cation distance predicts the ordering, and it
      does so causally.

      '
    derived_interpretation: 'Thermodynamically irrelevant for transport at room temperature. This is a
      MECHANISTIC CONTRAST establishing that path choice inside one mineral outweighs mineral choice --
      the 331 meV spread within greigite exceeds the 225 meV spread across mackinawite, marcasite and
      pyrite V_Fe combined -- not a competing channel.

      '
