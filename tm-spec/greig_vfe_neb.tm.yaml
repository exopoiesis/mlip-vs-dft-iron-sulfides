# TM-Spec v0.3 artefact: Greigite Fe3S4 V_Fe octahedral + S-H symmetric hop NEB
# PRELIMINARY -- first bulk DFT NEB barrier for greigite; barrier >> kinetic threshold.
# id: tm.greig.vfe.neb.2026-06-04

spec: tm-spec/0.3
kind: NEBCalculation
id: tm.greig.vfe.neb.2026-06-04
schema_url: https://exopoiesis.github.io/tm-spec/0.3.json

# -- 1. STRUCTURE ---------------------------------------------------------
structure:
  formula: Fe23S32H1           # 56-atom conventional cell: Fe24S32 minus 1 V_Fe plus 1 H
  prototype: AB_cF56_227_d_e   # AFLOW: greigite inverse spinel Fd-3m
  space_group: { number: 227, symbol: Fd-3m }
  supercell: [1, 1, 1]
  pbc: [true, true, true]
  ref: structures/greig_56at_pristine.extxyz

# -- 2. DEFECTS -----------------------------------------------------------
defects:
  reactions:
    - "Fe_Fe^x -> V_Fe'' + Fe(removed)"
    - "nil -> H_i^+ + e'"
  population:
    V_Fe: { count: 1, site: "octahedral_16d" }
    H_int: { count: 1, site: S-adjacent_cavity }

# -- 3. MAGNETIC STATE ----------------------------------------------------
magnetic:
  state: ferri
  collinear: true
  magmoms_uB:
    Fe_tet_8a: -3.5
    Fe_oct_16d: 3.5
  surrogate_warning: "U=0 PBE under-localizes local moments ~35% vs Devey 2009; ferri order preserved"

# -- 4. CALCULATION -------------------------------------------------------
calculation:
  method: DFT
  level:
    xc: PBE
    basis: { kind: plane_waves, cutoff_Ry: 80, rho_cutoff_Ry: 320 }
    pseudopotential: ONCV PBE
    smearing: { kind: gaussian, width_Ry: 0.005 }
    spin: collinear
  k_points: { mesh: [2, 2, 2], shift: [0, 0, 0] }
  convergence:
    scf_Ry_images: 1.0e-5
    scf_Ry_endpoints: 1.0e-6
    fmax_eV_per_A: 0.05
  code:
    name: QuantumESPRESSO
    version: "7.5"
    mpirun: "mpirun --allow-run-as-root --bind-to none -np 1 pw.x"

# -- 5. WORKFLOW (NEB) ----------------------------------------------------
workflow:
  kind: NEB
  stage: production
  endpoints:
    A:
      ref: artifacts/greig_endA_relaxed.extxyz
      E_eV: -88090.5982
      geometry_origin: dft_relaxed
    B:
      ref: artifacts/greig_endB_relaxed.extxyz
      E_eV: -88090.5982
      geometry_origin: dft_relaxed
  n_images: 9
  optimizer: FIRE
  fmax_eV_per_A: 0.05
  k_spring_eV_per_A2: 0.3
  reuse_relaxed: true
  prewrap: idpp

# -- 6. RESULTS -----------------------------------------------------------
results:
  Ea_forward_eV:
    value: 1.86
    ci95: [1.66, 2.06]
  delta_E_rxn_eV: 0.0
  status: RETRACTED
  retracted_on: 2026-09-22
  paper_quotable: false
  superseded_by: [tm.greig.vfe.channel.neb.2026-09-21, tm.greig.vfe.cation.neb.2026-09-21]
  validated_by: [chemist@opus, physicist@opus]
  retraction_reason: >
    NOT A MIGRATION BARRIER. The band ran along a trans axis of the V_Fe octahedron
    (d_S-S 4.853 A). The midpoint of a trans axis is the vacant Fe site itself, a special
    position of the vacancy site symmetry, where the force vanishes BY SYMMETRY rather than
    by convergence. The band therefore satisfies any fmax criterion it is given, converges in
    very few steps, and inherits its mirror symmetry from the initial interpolation. A partial
    Hessian at that midpoint carries THREE imaginary modes, so it is not a first-order saddle.
    The 1.86 eV is the energy of the proton at the interstitial vacant-Fe site relative to its
    sulfur anchor. Every derived quantity is withdrawn with it: the U scan
    (1.84/1.815/1.806/1.478 eV), the k/ecut scan, and the "kinetically forbidden at 298 K,
    tau ~90 Gyr" conclusion. The correct migration coordinate runs along the octahedron EDGES,
    of which there are two symmetry-distinct classes; see the superseding records.
    Record kept, not deleted, because it may already have been cited.
  notes: >
    Unaffected by the retraction and still valid: the cell and defect construction, the DFT
    method, the endpoint relaxation protocol, the U = 0 provenance, and M_tot -23.9 uB with
    ferri order preserved throughout the NEB.

# -- 7. SANITY GATES ------------------------------------------------------
sanity:
  - id: G01_FeS_bond
    rule: "min(Fe-S) > 2.00 A"
    observed: 2.27
    pass: true
  - id: G02_ferri_preserved
    rule: "M_tot consistent with Devey 2009 ferri reference"
    observed: "M_tot -23.9 uB vs Devey -24 uB"
    pass: true
  - id: G03_endpoints_distinct
    rule: "endpoints geometrically distinct (different S site occupation)"
    observed: "symmetric S->S hop, both endpoints energetically degenerate by symmetry"
    pass: true
  - id: G05_scf_converged
    rule: "all images SCF converged"
    pass: true
  - id: G08_idpp_prewrap
    rule: "protocol erratum #5: idpp prewrap applied"
    pass: true

# -- 8. PROVENANCE --------------------------------------------------------
provenance:
  date: "2026-06-04"
  author: igor@exopoiesis.space
  literature: [Devey2009_greigite, Vaughan1971_FeS2, Roldan2013_greig]
  compute:
    host: vast-ai-cloud
    gpu: A100-SXM4
    cost_usd: 38.0
    walltime_h: 16.0
  hash:
    inputs:  sha256:placeholder_greig_vfe_inputs
    outputs: sha256:placeholder_greig_vfe_outputs
